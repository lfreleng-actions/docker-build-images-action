# docker-build-images-action
#
# Builds a resolved list of container images in order, loading them into
# the local daemon or pushing them to registries, and reports what built,
# failed or was skipped (docker-workflows#34).
#
# Every default reproduces the image build loops the docker-workflows
# lanes carried inline: mode: load is the verify and merge lanes' loop,
# mode: push the release lane's. tests/test_equivalence.py proves that
# against the original step bodies. The image list comes from
# docker-build-matrix-action, whose images_json or matrix output this
# action accepts as its images input.
name: "🐳 Docker Build Images"
description: >
  Build Docker images in order, load them locally or push them to
  registries with their digests, and report each result.

inputs:
  # --- What to build ----------------------------------------------
  images:
    description: >
      The images to build, in build order: docker-build-matrix-action's
      images_json output, or its matrix output. Each entry needs 'name'
      and 'context'; 'dockerfile', 'target', 'build_args' (KEY=VALUE
      strings), 'build_flags' (a list of extra buildx arguments) and
      'depends_on' are optional. Every entry is checked before anything
      builds, names included. Empty builds nothing unless
      build_command is set.
    required: false
    default: ""
  path_prefix:
    description: >
      Project root, relative to the workspace. Contexts and Dockerfiles
      are relative to it, and build_command runs in it.
    required: false
    default: "."
  image_namespace:
    description: >
      Namespace for local tags. In mode: load every image builds as
      <namespace>/<name>:<local_tag>, aliased as <name>:<local_tag>; in
      mode: push the namespaced alias is added when it is a usable
      local prefix.
    required: false
    default: ""
  local_tag:
    description: >
      Tag for the local working copy of each image. Same-repository
      FROM chains reference it, as FROM base:verify.
    required: false
    default: "verify"
  build_flags:
    description: >
      Extra docker buildx arguments for every image, split as a shell
      splits them: for example '--network=host --pull'. The action's
      own flags (tags, --load, --push, --output, --platform, --file,
      --metadata-file, --builder) are refused; each has an input.
    required: false
    default: ""

  # --- Mode ------------------------------------------------------------
  mode:
    description: >
      'load' builds each image into the local daemon (the verify and
      merge lanes). 'push' builds and pushes to every repository and
      tag, capturing each pushed digest (the release lane).
    required: false
    default: "load"
  repositories:
    description: >
      mode: push. Comma- or newline-separated repository prefixes, such
      as 'ghcr.io/org' or 'nexus3.onap.org:10003/onap'; each image pushes
      as <prefix>/<name>; a registry alone, such as 'localhost:5000',
      also works. Empty builds without pushing, as a dry run.
    required: false
    default: ""
  tags:
    description: >
      mode: push. Comma- or whitespace-separated tags to push each image
      under, such as '1.2.3'. Required when repositories is set, unless
      push_by_digest is true, which refuses them.
    required: false
    default: ""
  push_by_digest:
    description: >
      mode: push. Push each image untagged, by digest alone, and report
      it in pushed, so a later job can tag it once its gates pass. Runs
      the docker-container builder on one platform as on several.
      Registry cleanup can delete an untagged manifest before it is
      tagged; see the README.
    required: false
    default: "false"
  platforms:
    description: >
      mode: push. Comma-separated build platforms; empty is the runner's.
      Several platforms push a manifest list, then pull one back by
      digest for local testing and scanning: the runner's platform when
      requested, otherwise the first one listed.
    required: false
    default: ""

  # --- mode: load behaviour ------------------------------------------
  build_permit_fail:
    description: >
      mode: load. Report failed builds and pass the step, carrying on
      with whatever built. mode: push refuses it: a partial publication
      is never a success.
    required: false
    default: "false"
  skip_dependents:
    description: >
      mode: load. Skip an image whose same-repository base failed or was
      skipped, rather than attempting it. Needs depends_on in the
      entries, as docker-build-matrix-action's matrix output carries.
    required: false
    default: "false"
  build_command:
    description: >
      mode: load. Run the project's own tooling to build the images
      (Maven's fabric8 plugin, jib, make) instead of building entries.
      The images it produced are found by inference, or named by
      build_command_images.
    required: false
    default: ""
  build_command_images:
    description: >
      Comma- or whitespace-separated name:tag references build_command
      produces. Declaring them skips inference, which cannot tell local
      builds from pulled bases on Docker's containerd image store, where
      both carry registry digests.
    required: false
    default: ""

  # --- Builder and reporting ----------------------------------------
  setup_buildx:
    description: >
      Set up buildx with the driver the build needs: 'docker', whose
      daemon same-repository FROM chains need, or 'docker-container'
      for a multi-platform push or push_by_digest. Set false to use a
      builder already set up.
    required: false
    default: "true"
  summary:
    description: "Write a build report to the step summary"
    required: false
    default: "true"

outputs:
  images:
    description: "JSON list of the local tags built, in build order"
    value: ${{ steps.build.outputs.images }}
  image_count:
    description: "Number of images built"
    value: ${{ steps.build.outputs.image_count }}
  images_list:
    description: >
      Space-separated local tags built, the form
      docker-save-images-action takes
    value: ${{ steps.build.outputs.images_list }}
  failed:
    description: >
      JSON list of failed builds: tags, or 'build_command' when the
      escape hatch fails
    value: ${{ steps.build.outputs.failed }}
  failed_count:
    description: "Number of failed builds"
    value: ${{ steps.build.outputs.failed_count }}
  results:
    description: >
      JSON list, one entry per image: {name, tag, status}, with status
      built, failed or skipped. name is the entry's name, or for
      build_command the repository; tag is the full local reference
    value: ${{ steps.build.outputs.results }}
  pushed:
    description: >
      mode: push. JSON list of {name, image, digest}, one per pushed
      repository, the subjects to sign and attest. image is the
      repository without a tag; with push_by_digest, each digest is
      read back from that repository's registry
    value: ${{ steps.build.outputs.pushed }}
  pushed_count:
    description: "Number of pushed image repositories"
    value: ${{ steps.build.outputs.pushed_count }}

runs:
  using: "composite"
  steps:
    - name: "Plan the builder"
      id: plan
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_IMAGES: ${{ inputs.images }}
        INPUT_IMAGE_NAMESPACE: ${{ inputs.image_namespace }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_LOCAL_TAG: ${{ inputs.local_tag }}
        INPUT_BUILD_FLAGS: ${{ inputs.build_flags }}
        INPUT_REPOSITORIES: ${{ inputs.repositories }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_PUSH_BY_DIGEST: ${{ inputs.push_by_digest }}
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        INPUT_BUILD_PERMIT_FAIL: ${{ inputs.build_permit_fail }}
        INPUT_SKIP_DEPENDENTS: ${{ inputs.skip_dependents }}
        INPUT_BUILD_COMMAND: ${{ inputs.build_command }}
        INPUT_BUILD_COMMAND_IMAGES: ${{ inputs.build_command_images }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_SETUP_BUILDX: ${{ inputs.setup_buildx }}
      run: |
        # Plan the builder
        # Standard library only, so no setup-python step: GitHub-hosted
        # runners ship a suitable python3. -I (isolated mode) keeps the
        # checked-out repository off sys.path; see entrypoint.py. Input
        # validation runs here too, so a misconfiguration fails before
        # any builder is set up.
        if ! python3 -I -c 'import sys; sys.exit(sys.version_info < (3, 10))' \
          > /dev/null 2>&1; then
          echo "::error::python3 3.10 or later is required on the runner"
          exit 1
        fi
        python3 -I "${GITHUB_ACTION_PATH}/entrypoint.py" plan

    - name: "Set up QEMU"
      if: steps.plan.outputs.qemu == 'true'
      # yamllint disable-line rule:line-length
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

    - name: "Set up Docker buildx"
      id: buildx
      if: steps.plan.outputs.setup_buildx == 'true'
      # yamllint disable-line rule:line-length
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      with:
        driver: ${{ steps.plan.outputs.driver }}

    - name: "Build images"
      id: build
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_IMAGES: ${{ inputs.images }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_IMAGE_NAMESPACE: ${{ inputs.image_namespace }}
        INPUT_LOCAL_TAG: ${{ inputs.local_tag }}
        INPUT_BUILD_FLAGS: ${{ inputs.build_flags }}
        INPUT_REPOSITORIES: ${{ inputs.repositories }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_PUSH_BY_DIGEST: ${{ inputs.push_by_digest }}
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        INPUT_BUILD_PERMIT_FAIL: ${{ inputs.build_permit_fail }}
        INPUT_SKIP_DEPENDENTS: ${{ inputs.skip_dependents }}
        INPUT_BUILD_COMMAND: ${{ inputs.build_command }}
        INPUT_BUILD_COMMAND_IMAGES: ${{ inputs.build_command_images }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_SETUP_BUILDX: ${{ inputs.setup_buildx }}
        # The builder set up above, empty when setup was skipped. With
        # the docker driver setup-buildx selects nothing, so without
        # this a builder the job selected earlier would be used.
        BUILD_IMAGES_BUILDER: ${{ steps.buildx.outputs.name }}
      run: |
        # Build images
        python3 -I "${GITHUB_ACTION_PATH}/entrypoint.py"
